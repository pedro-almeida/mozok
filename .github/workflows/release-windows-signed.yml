name: Build, Attest & Sign Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build & Sign mozok-native.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build mozok-native release binary
        run: cargo build --release --package mozok-native

      - name: Sign mozok-native.exe with Authenticode (when GitHub Secrets are configured)
        if: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $certPath /p $env:CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "target\release\mozok-native.exe"
          Remove-Item $certPath -Force

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "target\release\mozok-native.exe" -Algorithm SHA256).Hash
          "$hash  mozok-native.exe" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

      - name: Attest Build Provenance (GitHub Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'target/release/mozok-native.exe'

      - name: Upload Signed / Attested Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mozok-windows-x64
          path: |
            target/release/mozok-native.exe
            SHA256SUMS.txt
