[package]
name = "mozok-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native GPU-accelerated desktop application for the MOZOK 3D Human CNS & Connectome Explorer"

[[bin]]
name = "mozok-native"
path = "src/main.rs"

[dependencies]
mozok-core = { path = "../mozok-core" }
mozok-atlas = { path = "../mozok-atlas" }
mozok-navigation = { path = "../mozok-navigation" }
mozok-physiology = { path = "../mozok-physiology" }
mozok-pathology = { path = "../mozok-pathology" }

[target.'cfg(target_os = "windows")'.dependencies]
tao = "0.30"
wry = "0.47"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
